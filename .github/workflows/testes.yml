
name: CI - Agenda Lash

on:
  push:
    branches: [main, melhorias-agenda]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verificar sintaxe
        run: |
          node --check logica.js
          node --check testes.js

      - name: Executar testes e cobertura
        run: node --experimental-test-coverage --test testes.js
